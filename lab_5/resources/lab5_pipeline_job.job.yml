

resources:
  jobs:
    sample_job:
      name: lab5_pipeline_job


      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - yanquiel@yagdata.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.lab_5_etl.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"

