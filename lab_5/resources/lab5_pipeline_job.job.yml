resources:
  jobs:
    lab5_pipeline_job:
      name: lab5_pipeline_job

      trigger:
        periodic:
          interval: 1
          unit: DAYS
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - yanquiel@yagdata.com

      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.lab_5_etl.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"