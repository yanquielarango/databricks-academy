resources:
  pipelines:
    lab_5_etl:
      name: lab_5_etl

      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze_schema.name}

      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${resources.schemas.bronze_schema.name}
        silver_schema: ${resources.schemas.silver_schema.name}

      serverless: true

      root_path: ../src

      libraries:
        - glob:
            include: ../src/transformations/**

      environment:
        dependencies:
          - --editable ${workspace.file_path}