resources:
  jobs:
    gold_governance_job:
      name: gold_governance_job

      tasks:
        - task_key: create_rls_function
          sql_task:
            file:
              path: ../queries/create_gold_orders_rls_filter.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: apply_rls
          depends_on:
            - task_key: create_rls_function
          sql_task:
            file:
              path: ../queries/apply_gold_orders_rls.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: create_cls_mask
          depends_on:
            - task_key: apply_rls
          sql_task:
            file:
              path: ../queries/create_gold_orders_cls_mask.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: apply_cls
          depends_on:
            - task_key: create_cls_mask
          sql_task:
            file:
              path: ../queries/apply_gold_orders_cls_mask.sql
            warehouse_id: ${var.warehouse_id}