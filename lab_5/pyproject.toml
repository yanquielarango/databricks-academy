

[project]
name = "lab_5"
version = "0.0.1"
authors = [{ name = "yanquiel.arango@gmail.com" }]
requires-python = ">=3.10,<3.13"

dependencies = [
    "pandas",
    "numpy",
    "confluent-kafka",
    "databricks-sdk[notebook]>=0.123.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[project.scripts]
main = "lab_5.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
