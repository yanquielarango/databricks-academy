bundle:
  name: lakehouse_federation
  uuid: 17fbe79b-be7a-4d6f-9702-1453faebcde8

include:
  - resources/*.yml

variables:
  catalog:
    description: Databricks catalog used by the environment

  schema:
    description: Schema used by the lab

  warehouse_id:
    description: SQL Warehouse used to execute SQL tasks

  connection_name:
    description: Lakehouse Federation connection name

  foreign_catalog:
    description: Foreign catalog pointing to Neon PostgreSQL

  neon_host:
    description: Neon PostgreSQL host


targets:

  dev:
    mode: development
    default: true

    workspace:
      host: https://dbc-c04a5ad1-7844.cloud.databricks.com

    variables:
      catalog: dbr_dev
      schema: lakehouse_federation

      connection_name: neon_dev_connection
      foreign_catalog: neon_dvdrental_dev

      neon_host: ep-steep-boat-b1jg2rmj-pooler.c-5.eu-central-1.aws.neon.tech

      warehouse_id: 1a8ff5cbf85f90de


  prod:
    mode: production

    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net

      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: dbr_prod
      schema: lakehouse_federation

      connection_name: neon_prod_connection
      foreign_catalog: neon_dvdrental_prod

      neon_host: ep-steep-boat-b1jg2rmj-pooler.c-5.eu-central-1.aws.neon.tech

      warehouse_id: 3ed106620db591d9

    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE