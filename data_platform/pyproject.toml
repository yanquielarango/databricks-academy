[project]
name = "data_platform"
version = "0.0.1"
authors = [{ name = "yanquiel.arango@gmail.com" }]
requires-python = ">=3.10,<3.13"

dependencies = [
    "pandas",
    "numpy",
    "databricks-sdk[notebook]>=0.123.0",
    "databricks-zerobus-ingest-sdk>=1.8.0",
    "databricks-ai-search>=0.78",
    "openai>=3.11.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
    "databricks-labs-dqx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "unit_test: tests for transformation logic",
]
