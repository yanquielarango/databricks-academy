name: CI DEV

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: lab_5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Run unit tests
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: uv run pytest -m unit_test -v

  validate:
    name: Validate Bundle
    needs: unit-tests
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: lab_5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: databricks bundle validate -t dev

  deploy-dev:
    name: Deploy DEV
    needs: validate
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: lab_5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle to DEV
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: databricks bundle deploy -t dev

  post-deploy-automation:
    name: Post-deploy Automation
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: lab_5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Get deployed pipeline ID
        id: pipeline
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        shell: bash
        run: |
          echo "Reading deployed bundle resources..."

          SUMMARY=$(databricks bundle summary -t dev --force-pull)

          echo "$SUMMARY"

          PIPELINE_URL=$(echo "$SUMMARY" \
            | awk '
                /Pipelines:/ {in_pipelines=1; next}
                in_pipelines && /URL:/ {print $2; exit}
              ')

          if [ -z "$PIPELINE_URL" ]; then
            echo "Could not find pipeline URL in bundle summary."
            exit 1
          fi

          PIPELINE_ID=$(echo "$PIPELINE_URL" \
            | sed -E 's#.*/pipelines/([^?]+).*#\1#')

          if [ -z "$PIPELINE_ID" ]; then
            echo "Could not determine pipeline ID."
            exit 1
          fi

          echo "Pipeline ID: $PIPELINE_ID"
          echo "pipeline_id=$PIPELINE_ID" >> "$GITHUB_OUTPUT"

      - name: Trigger pipeline and monitor
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
          DATABRICKS_PIPELINE_ID: ${{ steps.pipeline.outputs.pipeline_id }}
          PIPELINE_FULL_REFRESH: "false"
        run: uv run python -u scripts/trigger_pipeline.py

      - name: Run DQX checks
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: uv run python -u scripts/run_dqx.py

      - name: Run reconciliation checks
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: uv run python -u scripts/run_reconciliation.py

      - name: Run Lab 9 notebook automation
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: uv run python -u scripts/run_notebook_job.py