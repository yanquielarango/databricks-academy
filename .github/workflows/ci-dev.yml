name: CI DEV

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: data_platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Run unit tests
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: uv run pytest -m unit_test -v

  validate:
    name: Validate Bundle
    needs: unit-tests
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: data_platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: databricks bundle validate -t dev

  deploy-dev:
    name: Deploy DEV
    needs: validate
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: data_platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle to DEV
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: databricks bundle deploy -t dev

  post-deploy-automation:
    name: Post-deploy Automation
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: data_platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      # ---------------------------------------------------------
      # Streaming infrastructure
      # ---------------------------------------------------------

      - name: Check Bronze streaming table
        id: streaming
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        shell: bash
        run: |
          set +e

          OUTPUT=$(databricks tables get \
            dbr_dev.yanquiel_bronze.orders_bronze \
            2>&1)

          EXIT_CODE=$?

          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "Bronze streaming table already exists."
            echo "setup_required=false" >> "$GITHUB_OUTPUT"

          elif echo "$OUTPUT" | grep -qiE \
            "does not exist|NOT_FOUND|RESOURCE_DOES_NOT_EXIST"; then

            echo "Bronze streaming table does not exist."
            echo "setup_required=true" >> "$GITHUB_OUTPUT"

          else
            echo "Unexpected error checking Bronze table:"
            echo "$OUTPUT"
            exit 1
          fi

      - name: Setup streaming resources
        if: steps.streaming.outputs.setup_required == 'true'
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: |
          databricks bundle run \
            -t dev \
            setup_streaming_resources

      # ---------------------------------------------------------
      # Pipeline
      # ---------------------------------------------------------

      - name: Get deployed pipeline ID
        id: pipeline
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        shell: bash
        run: |
          echo "Reading deployed bundle resources..."

          SUMMARY=$(databricks bundle summary -t dev --force-pull)

          echo "$SUMMARY"

          PIPELINE_URL=$(echo "$SUMMARY" \
            | awk '
                /Pipelines:/ {in_pipelines=1; next}
                in_pipelines && /URL:/ {print $2; exit}
              ')

          if [ -z "$PIPELINE_URL" ]; then
            echo "Could not find pipeline URL in bundle summary."
            exit 1
          fi

          PIPELINE_ID=$(echo "$PIPELINE_URL" \
            | sed -E 's#.*/pipelines/([^?]+).*#\1#')

          if [ -z "$PIPELINE_ID" ]; then
            echo "Could not determine pipeline ID."
            exit 1
          fi

          echo "Pipeline ID: $PIPELINE_ID"
          echo "pipeline_id=$PIPELINE_ID" >> "$GITHUB_OUTPUT"

      - name: Trigger pipeline and monitor
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
          DATABRICKS_PIPELINE_ID: ${{ steps.pipeline.outputs.pipeline_id }}
          PIPELINE_FULL_REFRESH: "false"
        run: |
          uv run python -u scripts/trigger_pipeline.py

      # ---------------------------------------------------------
      # Data quality
      # ---------------------------------------------------------

      - name: Run DQX checks
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: |
          uv run python -u scripts/run_dqx.py

      # ---------------------------------------------------------
      # Reconciliation
      # ---------------------------------------------------------

      - name: Run reconciliation checks
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: |
          uv run python -u scripts/run_reconciliation.py

      # ---------------------------------------------------------
      # Platform automation check
      # ---------------------------------------------------------

      - name: Run Lab 9 notebook automation
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: |
          uv run python -u scripts/run_notebook_job.py

  deploy-rag-app:
    name: Deploy RAG App
    needs: post-deploy-automation
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: data_platform/app

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: azure-cli
      APP_NAME: agent-data-platform-rag-v2
      APP_SOURCE_PATH: /Workspace/Users/yanquiel@yagdata.com/databricks_apps/agent-data-platform-rag-v2-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check Databricks authentication
        run: |
          databricks current-user me

      - name: Sync RAG app source
        run: |
          databricks sync \
            . \
            "$APP_SOURCE_PATH"

      - name: Deploy RAG app
        run: |
          databricks apps deploy "$APP_NAME" \
            --source-code-path "$APP_SOURCE_PATH" \
            --mode SNAPSHOT