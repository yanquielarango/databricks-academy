name: Test Databricks OIDC

on:
  workflow_dispatch:

jobs:
  test-oidc:
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GitHub variables
        run: |
          echo "CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}"
          echo "TENANT_ID=${{ vars.AZURE_TENANT_ID }}"
          echo "DATABRICKS_HOST=${{ vars.DATABRICKS_HOST }}"

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
      

      - name: Show Azure identity
        run: az account show

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Show Databricks identity
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: |
          databricks auth describe
          databricks current-user me